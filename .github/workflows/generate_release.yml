name: Build, Package and Release SystemHope Engine

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Habilitar rutas largas en Windows y Git
        run: |
          git config --global core.longpaths true
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -ErrorAction SilentlyContinue

      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias de compilacion
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller python-docx pywin32

      - name: Compilar ejecutable standalone con PyInstaller
        run: |
          pyinstaller --onefile --clean --name systemhope-engine `
            --add-data "docs/plantillas_maestras_index.json;docs" `
            --add-data "docs/directorio_proveedores_domicilios.json;docs" `
            --add-data "docs/casillas_habilitadas.json;docs" `
            --add-data "docs/MATRIZ_MAESTRA_PHOENYX_POPPERIANA.md;docs" `
            --add-data "docs/DIRECTORIO_PROVEEDORES_Y_DOMICILIOS_PROCESALES.md;docs" `
            --add-data "docs/MEMORIA_ESTILO_VISUAL_PAGINAS.md;docs" `
            src/systemhope_engine.py

      - name: Verificar ejecucion del binario compilado
        run: |
          ./dist/systemhope-engine.exe info
          ./dist/systemhope-engine.exe templates --rama vehicular --limit 3
          ./dist/systemhope-engine.exe notifications --proveedor pacifico

      - name: Crear paquete ZIP autonomo para AI IDEs Desktop
        # El paquete llevaba .cursorrules, .windsurfrules y CLAUDE.md. Se
        # retiraron del repositorio el 15/09/2026 porque predicaban la doctrina
        # de lectura que R-137 derogo: repartir reglas contradictorias en un
        # release es peor que no repartir ninguna. La fuente de reglas es
        # AGENTS.md, y una sola.
        run: |
          Compress-Archive -Path `
            dist/systemhope-engine.exe, `
            AGENTS.md, `
            README.md, `
            RESUMEN_EJECUTIVO.md, `
            docs/plantillas_maestras_index.json, `
            docs/directorio_proveedores_domicilios.json, `
            docs/casillas_habilitadas.json, `
            docs/CONTRADICCIONES_RESUELTAS.md, `
            docs/DIRECTORIO_PROVEEDORES_Y_DOMICILIOS_PROCESALES.md, `
            docs/INDICE_TAXONOMICO_PLANTILLAS_MAESTRAS.md, `
            docs/MEMORIA_ESTILO_VISUAL_PAGINAS.md, `
            docs/MATRIZ_MAESTRA_PHOENYX_POPPERIANA.md, `
            docs/SUPERVISION_DE_AGENTES.md, `
            docs/PLAN_VELOCIDAD_SIN_COLGARSE.md `
            -DestinationPath dist/systemhope-engine-windows-x64.zip -Force

      - name: Publicar Release en GitHub con Binarios y Memoria
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.${{ github.run_number }}
          name: "SystemHope ResAdmis v2.3.${{ github.run_number }} - Fórmula Canónica de Traslado y Descargos (R-155)"
          body: |
            # SystemHope ResAdmis v2.3.${{ github.run_number }}

            Motor ejecutable, **593 plantillas Word anonimizadas y 3 modelos base**
            completamente calibrados con la nueva fórmula obligatoria de traslado
            y descargos (R-155), derogando de forma absoluta las fórmulas históricas previas.

            ## Fórmula Obligatoria de Traslado y Descargos (R-155)
            
            Se adoptó la fórmula canónica obligatoria para el traslado de resolución y descargos
            en las 596 plantillas del repositorio (`plantillas_maestras/` y `automatizacion_antigravity/modelos/`),
            erradicando cualquier rastro de las fórmulas históricas A y B:
            - **Traslado de la resolución:** Notificación formal de la resolución admisoria a los denunciados.
            - **Cita legal estricta:** Artículo 26° de la Ley sobre Facultades, Normas y Organización del Indecopi (D.L. 807).
            - **Plazo uniforme y cómputo:** Cinco (5) días hábiles contado a partir del día siguiente de la notificación.
            - **Apercibimiento formal de rebeldía:** Declaración de rebeldía por el Secretario Técnico.
            - **Presunción de veracidad legal:** Aplicación del artículo 223° del TUO de la Ley N° 27444 (LPAG).
            - **Distinción gramatical rigurosa:** Singular (`presente`) para 1 denunciado (120 plantillas) vs. Plural (`presenten`) para 2 o más denunciados (474 plantillas).

            ## Falsador Computable R-155 en `verificar_admisorio.py`
            - **R-155 (`prueba_r155_formula_traslado`):** Refuta cualquier admisorio que contenga
              las fórmulas derogadas ("contados desde la notificación" o cita al artículo 233) o
              que altere la redacción literal de los descargos y apercibimientos.

            ## Calibración Visual Popperiana Previa (R-153 y R-154)
            - **848 etiquetas `<w:highlight>` purgadas (R-154):** Cero resaltados en todo el corpus.
            - **7 614 llamadas de notas elevadas a superíndice (document.xml) (R-153).**
            - **7 584 números de nota al pie calibrados (footnotes.xml) (R-153).**
            - **596 estilos `Refdenotaalpie` y `FootnoteReference` asegurados (styles.xml).**

            ## Reglas invariantes del sistema
            - **Cero OCR, Google Lens en todas las páginas** (R-137).
            - **Las partes son exactamente las de la cédula** (R-138), y la
              casilla exige además R-151.
            - **Un ordinal por VÍA, no por parte** (R-147).
            - **Ni Word ni scratch** (R-139). **Prohibido generar PDF.**
            - **Nada que no conste en el expediente.**

          files: |
            dist/systemhope-engine.exe
            dist/systemhope-engine-windows-x64.zip
