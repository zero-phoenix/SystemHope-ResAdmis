name: Build, Package and Release SystemHope Engine

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Habilitar rutas largas en Windows y Git
        run: |
          git config --global core.longpaths true
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -ErrorAction SilentlyContinue

      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias de compilacion
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller python-docx pywin32

      - name: Compilar ejecutable standalone con PyInstaller
        run: |
          pyinstaller --onefile --clean --name systemhope-engine `
            --add-data "docs/plantillas_maestras_index.json;docs" `
            --add-data "docs/directorio_proveedores_domicilios.json;docs" `
            --add-data "docs/MATRIZ_MAESTRA_PHOENYX_POPPERIANA.md;docs" `
            --add-data "docs/DIRECTORIO_PROVEEDORES_Y_DOMICILIOS_PROCESALES.md;docs" `
            --add-data "docs/MEMORIA_ESTILO_VISUAL_PAGINAS.md;docs" `
            src/systemhope_engine.py

      - name: Verificar ejecucion del binario compilado
        run: |
          ./dist/systemhope-engine.exe info
          ./dist/systemhope-engine.exe templates --rama vehicular --limit 3
          ./dist/systemhope-engine.exe notifications --proveedor pacifico

      - name: Crear paquete ZIP autonomo para AI IDEs Desktop
        run: |
          Compress-Archive -Path `
            dist/systemhope-engine.exe, `
            AGENTS.md, `
            README.md, `
            .cursorrules, `
            .windsurfrules, `
            CLAUDE.md, `
            docs/plantillas_maestras_index.json, `
            docs/directorio_proveedores_domicilios.json, `
            docs/DIRECTORIO_PROVEEDORES_Y_DOMICILIOS_PROCESALES.md, `
            docs/INDICE_TAXONOMICO_PLANTILLAS_MAESTRAS.md, `
            docs/MEMORIA_ESTILO_VISUAL_PAGINAS.md, `
            docs/MATRIZ_MAESTRA_PHOENYX_POPPERIANA.md `
            -DestinationPath dist/systemhope-engine-windows-x64.zip -Force

      - name: Publicar Release en GitHub con Binarios y Memoria
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "SystemHope ResAdmis v2.0.${{ github.run_number }} - Engine & Persistent Memory"
          body: |
            # SystemHope ResAdmis - Release Oficial v2.0.${{ github.run_number }}

            Este release provee el motor ejecutable independiente (`systemhope-engine.exe`), el catálogo maestro de **630 plantillas Word (.docx)** depuradas y el paquete de memoria persistente para permitir que **Antigravity IDE**, **Cursor**, **Windsurf**, **Claude Code** o cualquier entorno de IA Desktop opere de manera 100% determinista y autónoma.

            ## 🚀 Lo Nuevo en este Release

            ### 1. Actualización Normativa Integral TUO LPAG (D.S. 006-2026-JUS)
            - **Cero citas derogadas:** 100% de citas al D.S. 004-2019-JUS erradicadas en todo el corpus.
            - **TUO Vigente:** Actualización obligatoria al **Decreto Supremo 006-2026-JUS** y fecha de publicación al **30 de abril de 2026**.

            ### 2. Catálogo Taxonómico Maestro de 630 Plantillas Word (.docx)
            - **17 Ramas de Seguro Estructuradas:** Desgravamen, Protección de Tarjetas, Vehicular, Vida, SOAT/AFOCAT, SCTR, Salud/EPS, etc.
            - **Clasificación en 4 Niveles:** `Rama` / `Materia` / `Proveedor (1 DDO vs 2+ DDOs)` / `Sujeto (Varón, Mujer, Sucesión)`.
            - **100% Validación OOXML:** Todos los archivos preservan cabeceras, firmas digitales, pies `M-CPC-01/03` y `word/footnotes.xml`.
            - **Exclusión Estricta de PDFs en Git:** Los 881 PDFs originales permanecen ignorados en Git tras haber servido como patrón de calibración visual.

            ### 3. Memoria Permanente de Estilo Visual y Geometría de Página (Google Lens)
            - Extraído mediante visión multimodal en `docs/MEMORIA_ESTILO_VISUAL_PAGINAS.md`:
              - Formato A4 (21.0 x 29.7 cm), márgenes exactos: Izq 3.0 cm, Der 2.5 cm, Sup 2.5 cm, Inf 2.5 cm.
              - Tipografía `Arial Narrow` (11 pt cuerpo a interlineado 1.0; 8 pt notas al pie e iniciales `LGP/JCQ`).
              - Sangrías escalonadas CC1: Hechos a `0.79"/-0.39"`, Resolutivo a `0.39"/-0.39"`.
              - Carácter **One Dot Leader (`\u2024`)** en listas de notas al pie para neutralizar sangrías automáticas de Word COM.

            ### 4. Invariantes Popperianas de Redacción y Calibración Forense (R-85 a R-110)
            - **R-85:** Prohibición categórica de imputar por "inducción a error" (Arts. 1.1.b y 2 del Código).
            - **R-86:** Hechos objetivos en pasado simple, sin la palabra "denunciante" ni su nombre en el relato.
            - **R-87:** Prohibición del condicional "habría" en hechos propios (reservado para conductas atribuidas al denunciado).
            - **R-89:** Moneda institucional monolítica: `S/ X XXX,XX` o `US$ X XXX,XX`.
            - **R-90:** Filtro léxico estricto: `cónyuge`, `luego de`, `esta/este` sin tilde, `médico`, `vehículo`.
            - **R-96:** Denominación procesal unívoca: `el señor [Apellido]`, `la causante de la Sucesión Intestada`, alias formal de empresas.
            - **R-97:** **Teorema de Simetría Verbatim:** El núcleo fáctico de la Considerativa (Sec. II) es 100% idéntico al de la Resolutiva (`PRIMERO:`).
            - **R-98:** **Notificación Conjunta en Párrafo Único:** Cuando las partes comparten domicilio o vía de notificación (correo o casilla), se agrupan en un solo artículo resolutivo.
            - **R-99 / R-108:** Requerimiento probatorio específico: subincisos en números romanos minúsculos en línea `(i)`, `(ii)`, `(iii)` idénticos entre considerativa y resolutiva.
            - **R-100:** Anclaje y fórmula de traslado de otro órgano resolutivo en nota al pie (pág. 1).
            - **R-101:** Información sobre escala de sanciones (hasta 450 UIT) y allanamiento como atenuante.
            - **R-102:** Facultad de conciliación previa con poder notarial legalizado.
            - **R-103:** **Matriz de Firma Condicionada por Proveedor:** En denuncias contra RÍMAC SEGUROS Y REASEGUROS S.A. firma obligatoriamente `LUISA ANALÍ SILVA MALPARTIDA` (Secretaria Técnica Ad Hoc, refrendo `LSQ/DCQ`). Para otros proveedores: `EVELING ROA QUISPE` (Secretaria Técnica).
            - **R-104:** Integridad tipográfica: metadatos y ordinales (`PRIMERO:` a `DÉCIMO:`) 100% en negrita.
            - **R-105:** Prohibición de párrafos numerados vacíos y de secciones anunciadas sin contenido.
            - **R-106:** Anclas obligatorias en cuerpo para todas las notas al pie.
            - **R-107:** Estructura de sección con 6 referencias de encabezado y pie.
            - **R-109:** Protocolo de verificación obligatoria con `scripts/verificar_admisorio.py` antes de cualquier entrega.
            - **R-110:** Modo verbal y atribución estricta en antecedentes y hechos.

            ### 5. Suite de Validación y Casos de Control
            - Incluye caso de prueba de control: `casos_de_prueba/admisorio_01_exp_2662_2026/RES_02_2662-2026_CC1_ADMISORIO.docx` (Expediente 2662-2026 contra Rímac, 7 páginas exactas, APTO con 0 falsadores).
            - Script de verificación automatizada: `scripts/verificar_admisorio.py`.

            ## Componentes Incluidos
            - **`systemhope-engine.exe`**: Binario Windows x64 autónomo con servidor MCP integrado.
            - **`systemhope-engine-windows-x64.zip`**: Paquete de distribución con ejecutable, catálogo e índices.

            ## Conexión Rápida para cualquier IA Desktop
            ```powershell
            # Volcar memoria y doctrina en cualquier máquina:
            ./systemhope-engine.exe dump-memory
            # Consultar vía de notificación oficial:
            ./systemhope-engine.exe notifications --proveedor "rimac"
            # Buscar plantilla por rama y materia:
            ./systemhope-engine.exe templates --rama vehicular --materia negativa_cobertura
            # Validar resolución generada:
            ./systemhope-engine.exe validate <resolucion.docx>
            ```
          files: |
            dist/systemhope-engine.exe
            dist/systemhope-engine-windows-x64.zip
