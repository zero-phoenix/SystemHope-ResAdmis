name: Build, Package and Release SystemHope Engine

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Habilitar rutas largas en Windows y Git
        run: |
          git config --global core.longpaths true
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -ErrorAction SilentlyContinue

      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias de compilacion
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Compilar ejecutable standalone con PyInstaller
        run: |
          pyinstaller --onefile --clean --name systemhope-engine `
            --add-data "docs/plantillas_maestras_index.json;docs" `
            --add-data "docs/directorio_proveedores_domicilios.json;docs" `
            --add-data "docs/casillas_habilitadas.json;docs" `
            --add-data "docs/MATRIZ_MAESTRA_PHOENYX_POPPERIANA.md;docs" `
            --add-data "docs/DIRECTORIO_PROVEEDORES_Y_DOMICILIOS_PROCESALES.md;docs" `
            --add-data "docs/MEMORIA_ESTILO_VISUAL_PAGINAS.md;docs" `
            src/systemhope_engine.py

      - name: Verificar ejecucion del binario compilado
        run: |
          ./dist/systemhope-engine.exe info
          ./dist/systemhope-engine.exe templates --rama vehicular --limit 3
          ./dist/systemhope-engine.exe notifications --proveedor pacifico

      - name: Crear paquete ZIP autonomo para AI IDEs Desktop
        # El paquete llevaba .cursorrules, .windsurfrules y CLAUDE.md. Se
        # retiraron del repositorio el 15/09/2026 porque predicaban la doctrina
        # de lectura que R-137 derogo: repartir reglas contradictorias en un
        # release es peor que no repartir ninguna. La fuente de reglas es
        # AGENTS.md, y una sola.
        run: |
          Compress-Archive -Path `
            dist/systemhope-engine.exe, `
            AGENTS.md, `
            README.md, `
            RESUMEN_EJECUTIVO.md, `
            docs/plantillas_maestras_index.json, `
            docs/directorio_proveedores_domicilios.json, `
            docs/casillas_habilitadas.json, `
            docs/CONTRADICCIONES_RESUELTAS.md, `
            docs/DIRECTORIO_PROVEEDORES_Y_DOMICILIOS_PROCESALES.md, `
            docs/INDICE_TAXONOMICO_PLANTILLAS_MAESTRAS.md, `
            docs/MEMORIA_ESTILO_VISUAL_PAGINAS.md, `
            docs/MATRIZ_MAESTRA_PHOENYX_POPPERIANA.md, `
            docs/SUPERVISION_DE_AGENTES.md, `
            docs/PLAN_VELOCIDAD_SIN_COLGARSE.md `
            -DestinationPath dist/systemhope-engine-windows-x64.zip -Force

      - name: Paquete portatil (Python 3.12 embebido + MinGit + repositorio)
        # Para cualquier PC sin Python ni Git: lo instala arranque/instalar.ps1
        # en %USERPROFILE%\SystemHope sin permisos de administrador. Sin OCR.
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./arranque/construir_portable.ps1 -Version "v3.5.${{ github.run_number }}"

      - name: Publicar Release en GitHub con Binarios y Memoria
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.5.${{ github.run_number }}
          name: "SystemHope ResAdmis v3.5.${{ github.run_number }}"
          body: |
            # SystemHope ResAdmis v3.5.${{ github.run_number }}

            Reglas vigentes: `AGENTS.md`. Cambios: `CHANGELOG.md`.

            Motor v3.5.2: R-212 conserva la cita completa cuando el escrito se cita como «presentado el [fecha]»; el terminador exige «por». 57 mutaciones, 7 pruebas de traslado y 14 casos ficticios en CI.
            Motor v3.5.1: R-212 compara la cita completa del traslado, incluidas subsanaciones y complementos; `entregar` identifica el ordinal de admision por su contenido. Pruebas de conservacion de inadmisibilidad/confidencialidad e idempotencia en CI.
            - Corpus medido: 574 plantillas; 516 admiten en PRIMERO, 57 en SEGUNDO y 1 en TERCERO; 252 citas compuestas; 4 plantillas con cita de traslado divergente detectadas en v3.5.2.

            v3.5: correcciones definitivas de la revision del Exp. 2889-2026 (24/09/2026).
            - Reclamos: la considerativa (88.1 o art. 24) cierra el hecho con «; involucraría una presunta afectación a su derecho de recibir respuestas adecuadas a los reclamos formulados. Por consiguiente…» (R-211); 109 plantillas, 167 parrafos.
            - Traslado: «correr traslado de la denuncia del …[, subsanada mediante escrito del …] a …», con la cita completa del ordinal de admision; nunca «de la presente resolución» (R-212); 574 plantillas.
            - Modificacion unilateral de la prima o de las condiciones: literal c) del articulo 56 (metodos comerciales coercitivos), no idoneidad (R-213).
            - El constructor aplica ambas y sincroniza la cita del traslado; el verificador las exige; 57 mutaciones, 14 casos ficticios y regresiones de traslado en CI.

            v3.4: revision del instructor sobre el Exp. 2898-2026 R2 (24/09/2026).
            - HECHOS: sujeto tacito en las vinetas; la tratativa solo en la apertura y la medida correctiva (R-210; 94 % del corpus).
            - Negativa de cobertura: «de manera injustificada / indebida», nunca «injustificadamente» (R-209).
            - Rotulo del requerimiento de cada denunciado subrayado; el saneador lo repara solo (R-208).
            - 51 mutaciones y 14 casos ficticios en CI.
            v3.3: deber de informacion en la considerativa (24/09/2026).
            - Toda imputacion por el articulo 1, numeral 1, literal b) y el articulo 2 cierra el hecho con «; involucraría una presunta afectación al derecho de información de los consumidores. Por consiguiente, corresponde calificar…» (R-207). El resolutivo no cambia.
            - 168 plantillas maestras migradas (232 parrafos); el constructor la añade y el verificador la exige; 48 mutaciones en CI.

            v3.2: correcciones definitivas del instructor sobre la remesa de 11 admisorios y el Exp. 3092-2026 (24/09/2026).
            - Imputaciones: mandan las plantillas por sentido y finalidad (la tabla es referencial); una imputacion por solicitud y por cobertura (R-206); «la denunciante» (R-205); «compañía aseguradora» (R-201).
            - Hechos: «adquirio» (R-204); sin palabras valorativas (R-203).
            - Notas: la de la norma imputada solo en la primera imputacion de ese articulo (R-202); nota de presentacion en CC1 quitada y renumerada (R-167).
            - `scripts/sanear_admisorio.py`: el constructor sanea solo (separadores entre imputaciones, notas del traslado, Codigo y competencia, ids sin colisiones).
            - `entregar`: fechas en letras o en numeros y «setiembre/septiembre» se anclan igual; `pdftotext` en UTF-8.
            - 47 mutaciones y 14 casos ficticios en CI.

            v3.1: revision pagina por pagina del instructor (24/09/2026), plan popperiano.
            - Notas al pie: integras, en su ancla, sin llamadas pegadas, con la norma que cita la frase, alineadas a 1 cm (R-183 a R-187).
            - Partes: nombre completo de la denunciante en las imputaciones, «la compañía aseguradora» solo si es la unica denunciada, alias en el rotulo del requerimiento (R-188 a R-190).
            - Forma: solo el rotulo en negrita (tambien PRIMERO), subrayado solo en el rotulo del requerimiento, «Firmado digitalmente por», sin huecos (R-164, R-191 a R-194).
            - `admisorio.py previsualizar` (ONLYOFFICE, fiel a Word) y `_FORMATO.md` (formato de cada hoja, cero OCR).
            - Corpus de 574 plantillas migrado; 41 mutaciones y casos ficticios de extremo a extremo en CI.

          files: |
            dist/systemhope-engine.exe
            dist/systemhope-engine-windows-x64.zip
            dist/SystemHope-Portable-win64.zip
            dist/SHA256.txt
            dist/VERSION.txt
