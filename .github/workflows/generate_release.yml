name: Generar Resoluciones y Release

on:
  push:
    branches:
      - main

jobs:
  generate-and-release:
    runs-on: [self-hosted, windows]

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar uv (si no está instalado)
        run: |
          if (!(Get-Command uv -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest -Uri https://astral.sh/uv/install.ps1 -OutFile install_uv.ps1
            powershell -ExecutionPolicy ByPass -File install_uv.ps1
          }

      - name: Ejecutar script de generación (generar.py)
        run: |
          uv run --with pywin32 --with python-docx python automatizacion_antigravity/generar.py
          
      - name: Mover Word generado al Escritorio
        run: |
          if (Test-Path "*.docx") {
            Copy-Item *.docx "$env:USERPROFILE\Desktop\" -Force
            Write-Output "Documentos movidos al Escritorio local."
          }

      - name: Crear Release de GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Actualización de Código v1.0.${{ github.run_number }}
          body: Nueva versión del código de automatización desplegada.
