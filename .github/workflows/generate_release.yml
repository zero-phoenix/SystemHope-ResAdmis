name: Build, Package and Release SystemHope Engine

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Habilitar rutas largas en Windows y Git
        run: |
          git config --global core.longpaths true
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -ErrorAction SilentlyContinue

      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias de compilacion
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller python-docx pywin32

      - name: Compilar ejecutable standalone con PyInstaller
        run: |
          pyinstaller --onefile --clean --name systemhope-engine `
            --add-data "docs/plantillas_maestras_index.json;docs" `
            --add-data "docs/directorio_proveedores_domicilios.json;docs" `
            --add-data "docs/MATRIZ_MAESTRA_PHOENYX_POPPERIANA.md;docs" `
            --add-data "docs/DIRECTORIO_PROVEEDORES_Y_DOMICILIOS_PROCESALES.md;docs" `
            --add-data "docs/MEMORIA_ESTILO_VISUAL_PAGINAS.md;docs" `
            src/systemhope_engine.py

      - name: Verificar ejecucion del binario compilado
        run: |
          ./dist/systemhope-engine.exe info
          ./dist/systemhope-engine.exe templates --rama vehicular --limit 3
          ./dist/systemhope-engine.exe notifications --proveedor pacifico

      - name: Crear paquete ZIP autonomo para AI IDEs Desktop
        # El paquete llevaba .cursorrules, .windsurfrules y CLAUDE.md. Se
        # retiraron del repositorio el 15/09/2026 porque predicaban la doctrina
        # de lectura que R-137 derogo: repartir reglas contradictorias en un
        # release es peor que no repartir ninguna. La fuente de reglas es
        # AGENTS.md, y una sola.
        run: |
          Compress-Archive -Path `
            dist/systemhope-engine.exe, `
            AGENTS.md, `
            README.md, `
            RESUMEN_EJECUTIVO.md, `
            docs/plantillas_maestras_index.json, `
            docs/directorio_proveedores_domicilios.json, `
            docs/DIRECTORIO_PROVEEDORES_Y_DOMICILIOS_PROCESALES.md, `
            docs/INDICE_TAXONOMICO_PLANTILLAS_MAESTRAS.md, `
            docs/MEMORIA_ESTILO_VISUAL_PAGINAS.md, `
            docs/MATRIZ_MAESTRA_PHOENYX_POPPERIANA.md, `
            docs/SUPERVISION_DE_AGENTES.md, `
            docs/PLAN_VELOCIDAD_SIN_COLGARSE.md `
            -DestinationPath dist/systemhope-engine-windows-x64.zip -Force

      - name: Publicar Release en GitHub con Binarios y Memoria
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "SystemHope ResAdmis v2.0.${{ github.run_number }} - Engine & Persistent Memory"
          body: |
            # SystemHope ResAdmis v2.0.${{ github.run_number }}

            Motor ejecutable, catalogo de **620 plantillas Word anonimizadas** y la
            memoria de reglas del sistema, para que un agente redactor opere de forma
            determinista y verificable.

            ## Lo nuevo, y es una limpieza de fondo

            ### Las 630 plantillas llevaban el nombre de un consumidor real
            Medido sobre una muestra de 40: **39 identificaban a una persona**. Ampliado
            a todas: **630 de 630**, 6.869 sustituciones aplicadas. Anonimizarlas no las
            degrada, las mejora: un modelo que dice «el senor Espinoza» invita al
            reemplazo a ciegas; uno que dice «el senor [APELLIDO]» obliga a rellenar
            desde la cedula, que es la fuente correcta. Se conservan polizas, fechas,
            montos y articulos.

            ### El repositorio publicaba lo que no debia
            De **1.481 archivos rastreados a 725**. Fuera los expedientes reales, los
            admisorios emitidos, un XLSX de personas, 31 bases de datos, 47 scripts de
            un solo uso y 16 herramientas con rutas de otra maquina. Nada se borro del
            disco del instructor: lo que se retira es la publicacion.

            ### Reglas contradictorias retiradas
            `.cursorrules`, `.windsurfrules` y `CLAUDE.md` predicaban «vision solo en
            paginas sin capa de texto», la doctrina que **R-137 derogo**. Un repositorio
            que contradice sus reglas vigentes le da al agente permiso escrito para
            incumplirlas. La fuente de reglas es `AGENTS.md`, y una sola. Por eso este
            paquete ya no los incluye.

            ### Tres barreras de calidad, no una
            - `verificar_admisorio.py` — la forma.
            - `construir_admisorio.py` — que no sobreviva nada de la plantilla de origen.
            - `auditar_admisorio.py` — **que cada dato exista en el expediente**. Nueva.
              En su primer barrido sobre cuatro admisorios ya dados por buenos encontro
              cuatro fechas sin ancla, un ordinal que contradecia a su cedula y dos
              apellidos inventados.

            ### El sistema se comprueba a si mismo
            `autocomprobacion.py`, en cada push. Cuatro pruebas, cada una nacida de un
            fallo real: ninguna expresion regular con un caracter de retroceso donde
            debe ir un limite de palabra (paso **tres veces**, y la peor dejo R-110
            declarando OK sin comprobar nada); ninguna plantilla con datos personales;
            todos los modulos compilan; ningun artefacto de trabajo rastreado. CI ademas
            le entrega al verificador un documento que **debe** rechazar: una regla que
            nunca falla no es una regla que se cumple.

            ### Supervision de agentes
            `docs/SUPERVISION_DE_AGENTES.md` y `scripts/orquestar.py`: como se lanza un
            caso, como se corrige al agente **mientras trabaja**, que medir y cuando
            intervenir. Con los dos catalogos de fallos medidos: los del agente y los
            del supervisor.

            ## Reglas que no se negocian
            - **Cero OCR, Google Lens en todas las paginas** (R-137).
            - **Las partes son exactamente las de la cedula** (R-138).
            - **Ni Word ni scratch** (R-139).
            - **Prohibido generar PDF.** El entregable es `.docx`, con el nombre
              `ADM <EXPEDIENTE> R<N>.docx`.
            - **Nada que no conste en el expediente.**

            ## Lo que sigue sin resolver
            El historial de este repositorio contiene los expedientes que hoy se
            retiran. Retirarlos del arbol no los quita del historial.

          files: |
            dist/systemhope-engine.exe
            dist/systemhope-engine-windows-x64.zip
