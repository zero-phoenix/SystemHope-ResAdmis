name: CI Verification

# Dos capas distintas y no intercambiables:
#
#  - `autocomprobacion.py` comprueba que el **sistema** no este roto de una forma
#    que nadie notaria: expresiones regulares con un caracter de retroceso en vez
#    de un limite de palabra, plantillas que conservan el nombre del consumidor
#    que las origino, modulos que no compilan, artefactos de trabajo rastreados.
#    Cada una de esas cuatro nace de un fallo real y medido (R-141).
#
#  - El motor se ejecuta de verdad, no solo se compila. Un `import` que funciona
#    no dice nada sobre un comando que falla al primer argumento.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  verify:
    name: Salud del repositorio y del motor
    runs-on: windows-latest
    steps:
      - name: Habilitar rutas largas en Windows y Git
        run: |
          git config --global core.longpaths true
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -ErrorAction SilentlyContinue

      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias minimas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Autocomprobacion del repositorio
        run: python scripts/autocomprobacion.py

      - name: Sintaxis de todo el utillaje
        run: |
          python -m compileall -q scripts src
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Ejecucion basica del motor
        run: |
          python -m src.systemhope_engine info
          python -m src.systemhope_engine notifications --proveedor pacifico
          python -m src.systemhope_engine templates --rama vehicular --limit 2

      - name: El verificador distingue de verdad
        # Una regla que nunca falla no es una regla que se cumple: es una regla
        # que no se esta ejecutando. Se le da un documento que DEBE rechazar.
        run: python scripts/prueba_verificador.py
