name: CI Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Habilitar rutas largas en Windows y Git
        run: |
          git config --global core.longpaths true
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -ErrorAction SilentlyContinue

      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias minimas
        run: |
          python -m pip install --upgrade pip
          pip install python-docx

      - name: Verificar sintaxis de modulos principales
        run: |
          python -m py_compile src/systemhope_engine.py
          python -m py_compile src/rules_engine.py
          python -m py_compile src/system_prompt.py

      - name: Test de ejecucion basica del motor
        run: |
          python -m src.systemhope_engine info
          python -m src.systemhope_engine notifications --proveedor pacifico
          python -m src.systemhope_engine templates --rama vehicular --limit 2
