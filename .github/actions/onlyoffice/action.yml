name: Instalar ONLYOFFICE Document Builder
description: Motor de vista de scripts/previsualizar.py (LibreOffice prohibido). Solo runners Linux con apt.
runs:
  using: composite
  steps:
    - name: Cache del paquete
      uses: actions/cache@v4
      with:
        path: ~/.cache/onlyoffice
        key: onlyoffice-documentbuilder-deb-v1
    - name: Instalar
      shell: bash
      run: |
        mkdir -p ~/.cache/onlyoffice
        DEB=~/.cache/onlyoffice/docbuilder.deb
        [ -s "$DEB" ] || curl -fsSL -o "$DEB" https://download.onlyoffice.com/install/desktop/docbuilder/linux/onlyoffice-documentbuilder_amd64.deb
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends "$DEB"
        test -x /opt/onlyoffice/documentbuilder/docbuilder
