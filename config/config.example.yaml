# ResAdmi - Configuración YAML (Alternativo a .env)
# Copia a config.yaml y personaliza

# Rutas del sistema
paths:
  templates: D:/BETTER CALL DAVID/ResAdmi/templates
  output: D:/BETTER CALL DAVID/ResAdmi/expedientes
  scratch: D:/BETTER CALL DAVID/ResAdmi/scratch
  logs: ./logs

# Configuración de Microsoft Word
word:
  timeout_seconds: 30
  visible: false
  library_path: C:\Program Files\Microsoft Office\root\Office16

# Validación de documentos
validation:
  strict_mode: true
  auto_clean_formatting: true
  enforce_article_validation: true
  forbidden_articles:
    - 24  # Nunca tipificar artículo 24

# Plantillas por defecto
templates:
  default_font: Arial Narrow
  default_size: 11
  default_alignment: justify
  footer_text: M-CPC-01/03

# Reglas de tipificación
typification:
  max_articles_per_fact: 3
  require_legal_references: true
  enforce_non_bis_in_idem: true

# Logging
logging:
  level: INFO
  format: json
  output:
    - console
    - file

# Información del usuario
metadata:
  institution: INDECOPI - Comisión 1
  commission: CC1
  secretary: Secretaría Técnica
